<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="JavaScriptの作品です" />
  <link rel="stylesheet" href="css/battle.css" />
  <title>JAVAクエスト</title>
</head>

<body>
  <div class="container">
    <table class="yuusya-status">
      <tr>
        <th colspan="2">勇 者</th>
      </tr>
      <tr>
        <th>HP:</th>
        <td class="player-hp">100</td>
      </tr>
      <tr>
        <th>MP:</th>
        <td class="player-mp">20</td>
      </tr>
    </table>

    <div class="battle-scene"></div>
  </div>
  <!--/.container-->

  <div class="enemy">
    <p class="enemy-name kappa-name">河童</p>
    <div class="enemy-image kappa-image">
      <img src="images/youkai_kappa.png" alt="敵" />
    </div>
  </div>
  <div class="action-box">
    <table class="action">
      <tr>
        <td class="attack">攻撃</td>
      </tr>
      <tr>
        <td class="heal">回復魔法(MP3消費)</td>
      </tr>
      <tr>
        <td class="spell">攻撃魔法(MP5消費)</td>
      </tr>
    </table>
  </div>
  <script src="javascript/kappa.js"></script>
</body>

</html>
